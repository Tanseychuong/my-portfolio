<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="logo">

                <h2>Portfolio CMS</h2>

            </div>

            <nav>

                <a href="dashboard.html">🏠 Dashboard</a>

                <a class="active" href="projects.html">

                    💼 Projects

                </a>

                <a href="blogs.html">📝 Blogs</a>

                <a href="messages.html">📩 Messages</a>

                <a href="analytics.html">📊 Analytics</a>

                <a href="settings.html">⚙️ Settings</a>

                <a href="#" id="logout">

                    Logout

                </a>

            </nav>

        </aside>

        <main>

            <div class="page-header">

                <h1>Projects</h1>

                <button id="addProject">

                    + Add Project

                </button>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Image</th>

                        <th>Title</th>

                        <th>Technology</th>

                        <th>Featured</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="projectTable">

                </tbody>

            </table>

        </main>

    </div>

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <h2 id="modalTitle">Add Project</h2>

            <form id="projectForm">

                <input type="hidden" id="projectId">

                <label for="title">Title</label>
                <input type="text" id="title" required>

                <label for="description">Description</label>
                <textarea id="description" rows="3" required></textarea>

                <label for="github_url">GitHub URL</label>
                <input type="url" id="github_url">

                <label for="live_url">Live URL</label>
                <input type="url" id="live_url">

                <label for="technologies">Technologies (comma separated)</label>
                <input type="text" id="technologies" placeholder="React, Node.js, MySQL">

                <label class="checkbox-label">
                    <input type="checkbox" id="featured">
                    Featured
                </label>

                <label for="image">Image</label>
                <input type="file" id="image" accept="image/*">

                <p id="formError" class="form-error"></p>

                <div class="modal-actions">

                    <button type="button" id="cancelModal">Cancel</button>
                    <button type="submit" id="saveProject">Save</button>

                </div>

            </form>

        </div>

    </div>

    <script src="../js/config.js"></script>
    <script src="js/projects.js"></script>

</body>

</html>
