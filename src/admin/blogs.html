<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blogs</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="logo">

                <h2>Portfolio CMS</h2>

            </div>

            <nav>

                <a href="dashboard.html">🏠 Dashboard</a>

                <a href="projects.html">💼 Projects</a>

                <a class="active" href="blogs.html">📝 Blogs</a>

                <a href="messages.html">📩 Messages</a>

                <a href="analytics.html">📊 Analytics</a>

                <a href="settings.html">⚙️ Settings</a>

                <a href="#" id="logout">Logout</a>

            </nav>

        </aside>

        <main>

            <div class="page-header">

                <h1>Blogs</h1>

                <button id="addBlog">+ Add Blog</button>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Image</th>

                        <th>Title</th>

                        <th>Published</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="blogTable">

                </tbody>

            </table>

        </main>

    </div>

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <h2 id="modalTitle">Add Blog</h2>

            <form id="blogForm">

                <input type="hidden" id="blogId">

                <label for="title">Title</label>
                <input type="text" id="title" required>

                <label for="content">Content</label>
                <textarea id="content" rows="6" required></textarea>

                <label for="image">Image</label>
                <input type="file" id="image" accept="image/*">

                <p id="formError" class="form-error"></p>

                <div class="modal-actions">

                    <button type="button" id="cancelModal">Cancel</button>
                    <button type="submit" id="saveBlog">Save</button>

                </div>

            </form>

        </div>

    </div>

    <script src="../js/config.js"></script>

</body>

</html>
