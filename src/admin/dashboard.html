<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio CMS</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <h2>Portfolio CMS</h2>
            </div>

            <nav>

                <a href="dashboard.html" class="active">🏠 Dashboard</a>

                <a href="projects.html">💼 Projects</a>

                <a href="blogs.html">📝 Blogs</a>

                <a href="messages.html">📩 Messages</a>

                <a href="analytics.html">📊 Analytics</a>

                <a href="settings.html">⚙️ Settings</a>

                <a href="#" id="logout">🚪 Logout</a>

            </nav>

        </aside>

        <!-- Main Content -->
        <main>

            <header>

                <h1>Welcome back, Chuong 👋</h1>

                <p>Manage your portfolio from here.</p>

            </header>

            <section class="cards">

                <div class="card">
                    <h3>Projects</h3>
                    <h2 id="projectCount">0</h2>
                </div>

                <div class="card">
                    <h3>Blogs</h3>
                    <h2 id="blogCount">0</h2>
                </div>

                <div class="card">
                    <h3>Messages</h3>
                    <h2 id="messageCount">0</h2>
                </div>

                <div class="card">
                    <h3>Visitors</h3>
                    <h2 id="visitorCount">0</h2>
                </div>

            </section>

            <section class="activity">

                <h2>Recent Activity</h2>

                <div id="activityList">

                    <p>Loading...</p>

                </div>

            </section>

        </main>

    </div>

    <script src="js/dashboard.js"></script>

</body>

</html>
